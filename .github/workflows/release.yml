name: Build APK and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The build names itself after the newest tag, which a shallow clone doesn't have.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK (incl. compileSdk 37) and Gradle picks it up
      # from ANDROID_HOME; upstream's release job relies on this too.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # Debug needs no signing secrets, so this works in a fork out of the box.
        run: ./gradlew :gearslip:assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          apk=build/Gearslip-debug.apk
          test -f "$apk" || { echo "no APK at $apk"; ls -R build | head -50; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: version
        run: |
          # Ignore tags generated by this workflow (they contain "-g") so names don't chain.
          tag=$(git describe --tags --match 'v*' --exclude '*-g*' --abbrev=7 2>/dev/null \
            || echo "v0.0.0-$(git rev-parse --short=7 HEAD)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          # Every build starts as a pre-release; promote it on GitHub after testing.
          prerelease: true
